name: Release

# Stages a publish to npm when a GitHub Release is published. A maintainer then
# approves it on npmjs.com (Staged Packages) with 2FA before it goes live, so a
# compromised workflow cannot publish on its own. Uses npm trusted publishing
# (OIDC), so no npm token is stored in the repository; the trusted publisher
# for @djmima/pubmed-mcp must point at this workflow file.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm stage publish needs npm 11.15.0 or later.
      - run: npm install -g npm@^11.15.0
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi
      # Lets a Release be made for a version that is already on npm (such as
      # v1.0.0, published by hand) and makes re-runs safe.
      - name: Skip if this version is already on npm
        id: published
        run: |
          spec=$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec is already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # npm documents prepublishOnly for npm publish only, so run the checks
      # and build here rather than relying on it.
      - name: Install, check, and build
        if: steps.published.outputs.skip != 'true'
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - run: npm stage publish
        if: steps.published.outputs.skip != 'true'
